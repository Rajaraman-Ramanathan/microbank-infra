---
- name: PostgreSQL Bootstrap
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/databases.yaml

  tasks:
    - name: Show PostgreSQL port
      ansible.builtin.debug:
        msg: "PostgreSQL Port = {{ postgres_port }}"

    - name: Display configured databases
      ansible.builtin.debug:
        msg: "{{ item.database }}"
      loop: "{{ postgres_databases }}"